[package]
name = "music-tag"
version = "0.1.1"
description = "MusicTag — 一次一首给本地裸 FLAC/MP3 补全元数据"
authors = ["xian"]
edition = "2021"

# mobile 兼容模板形态：lib 目标供 main.rs 调用 run()（与 create-tauri-app 等价）
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.24.0"
rfd = "0.17.2"
walkdir = "2.5.0"
image = "0.25.10"
base64 = "0.23.0"
tempfile = "3.27.0"
# dir-memory：dirs::config_dir() 定位平台配置目录（musictag/config.json）
dirs = "6"
# v1-search-backend：五源并发搜索 / 网易云加密 / 封面下载
reqwest = { version = "0.13", features = ["json", "form"] }
tokio = { version = "1", features = ["time", "macros", "rt"] }
async-trait = "0.1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rsa = "0.9"
rand = "0.9"
# search-sources-renewal：酷狗 complexsearch MD5 签名（纯 Rust，无 JS 引擎）
md5 = "0.7"
