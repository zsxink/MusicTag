name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read   # 默认；publish-tauri job 内显式写 write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pipe 原生测试套件（Issue #147 第 4 条 / design D4）。与 ci.yml 保持同一份套件清单。
      # 无条件执行 + 置于 npm ci 之前：零依赖、失败快，且不被 hashFiles 门静默跳过。
      - name: Test pipe native suites
        run: node --test '.agents/tools/pipe-core/test/*.test.js' 'tests/workflow-core/*.test.cjs' '.agents/tools/pipe-native/test/*.test.js'
      - name: Run pipe self-check
        run: node .agents/tools/pipe-native/self-check.js
      - name: Install frontend dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci
      - name: Build frontend
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build
      - name: Test frontend
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run test
      - name: Install Tauri Linux system dependencies
        if: ${{ hashFiles('src-tauri/Cargo.toml') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ hashFiles('src-tauri/Cargo.toml') != '' }}
      - name: Check Rust
        if: ${{ hashFiles('src-tauri/Cargo.toml') != '' }}
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Test Rust
        if: ${{ hashFiles('src-tauri/Cargo.toml') != '' }}
        working-directory: src-tauri
        run: cargo test --all-targets

  publish-tauri:
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install Linux system dependencies
        if: ${{ matrix.platform == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: 'MusicTag 发布'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
