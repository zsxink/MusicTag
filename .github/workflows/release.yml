name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read   # 默认；publish-tauri job 内显式写 write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pipe 原生测试套件（Issue #147 第 4 条 / design D4）。与 ci.yml 保持同一份套件清单。
      # 无条件执行 + 置于 npm ci 之前：零依赖、失败快，且不被 hashFiles 门静默跳过。
      - name: Test pipe native suites
        run: node --test '.agents/tools/pipe-core/test/*.test.js' 'tests/workflow-core/*.test.cjs' '.agents/tools/pipe-native/test/*.test.js'
      - name: Test Homebrew publisher
        run: node --test tests/homebrew/publish.test.mjs
      - name: Run pipe self-check
        run: node .agents/tools/pipe-native/self-check.js
      - name: Install frontend dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci
      - name: Build frontend
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build
      - name: Test frontend
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run test
      - name: Install Tauri Linux system dependencies
        if: ${{ hashFiles('src-tauri/Cargo.toml') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ hashFiles('src-tauri/Cargo.toml') != '' }}
      - name: Check Rust
        if: ${{ hashFiles('src-tauri/Cargo.toml') != '' }}
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Test Rust
        if: ${{ hashFiles('src-tauri/Cargo.toml') != '' }}
        working-directory: src-tauri
        run: cargo test --all-targets

  publish-tauri:
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install Linux system dependencies
        if: ${{ matrix.platform == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: 'MusicTag 发布'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # 全部 matrix 条目构建与资产上传成功后，把草稿 Release 自动转正并联动 tap 同步。
  # 依赖 needs 的默认 success 语义：任一 matrix 条目失败或被跳过，本 job 不执行，草稿保留可人工兜底。
  publish-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # gh release edit 所需最小权限
      actions: write   # gh workflow run（workflow_dispatch）所需最小权限
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish draft release and trigger tap sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 与 scripts/homebrew-publish.sh 相同的 retry 形态：3 次，2s/4s 退避。
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              [[ "$attempt" -eq 3 ]] || sleep "$((attempt * 2))"
            done
            return 1
          }
          # 幂等闸：已非草稿则 no-op，重跑不报错。
          if ! release_json=$(retry gh release view "$RELEASE_TAG" --json isDraft,tagName,isPrerelease); then
            echo "::error::Cannot read release metadata for $RELEASE_TAG after 3 attempts; draft preserved."
            exit 1
          fi
          if [[ "$(jq -r '.isDraft' <<< "$release_json")" != "true" ]]; then
            echo "Release $RELEASE_TAG already published; nothing to do."
            exit 0
          fi
          # 草稿转正：重试耗尽即 job 失败，Release 保留草稿态（人工 publish 兜底）。
          if ! retry gh release edit "$RELEASE_TAG" --draft=false; then
            echo "::error::Cannot publish $RELEASE_TAG after 3 attempts; draft preserved."
            exit 1
          fi
          # GITHUB_TOKEN 作出的 release: published 事件不会触发下游 workflow；
          # workflow_dispatch 是该抑制规则的例外，故显式派发（gh 默认派发到仓库默认分支），不等待结果。
          # 重试包裹：派发瞬时失败重试耗尽才失败；双重派发无害（concurrency 串行化 + tap 脚本幂等）。
          retry gh workflow run homebrew.yml -f tag="$RELEASE_TAG"
          echo "Published $RELEASE_TAG and dispatched homebrew.yml for tap sync."
